<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Narratify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="text-center mb-8">
            <a href="index.html" class="text-3xl font-bold tracking-tight text-gray-900">Narratify</a>
        </div>
        
        <div class="w-full max-w-sm bg-white p-8 border border-gray-200 rounded-lg shadow-sm">
            <h2 class="text-2xl font-bold text-center text-gray-900">Welcome back</h2>
            <p class="text-center text-gray-500 mt-2">Sign in to continue.</p>

            <form class="mt-8 space-y-6">
                <div>
                    <label for="email" class="text-sm font-medium text-gray-700">Email address</label>
                    <div class="mt-1">
                        <input id="email" name="email" type="email" autocomplete="email" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" autocomplete="current-password" required
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-gray-800 focus:border-gray-800 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gray-800 hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-800">
                        Login
                    </button>
                </div>
            </form>
            
            <p class="mt-6 text-center text-sm text-gray-500">
                Don't have an account?
                <a href="register.html" class="font-medium text-gray-800 hover:text-gray-600">
                    Register
                </a>
            </p>
        </div>
    </div>

</body>
</html>
